[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailvision"
version = "0.1.0"
description = "Multi-camera retail intelligence prototype: detection, tracking, cross-camera re-ID, zone analytics and POS association."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
retailvision = "retailvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that process video and take more than a few seconds",
    "gpu: tests that require a CUDA device",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
